name: Recorder (أكشن التسجيل)

on:
  workflow_dispatch:

permissions:
  contents: write

# أكشن مستقل لقسم التسجيل: ما يتجدد ولا ينتقل. نسخة وحدة بس تشتغل بنفس الوقت.
concurrency:
  group: zone-recorder
  cancel-in-progress: false

jobs:
  recorder:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Create .env
        run: |
          cat > .env << EOF
          PORT=3000
          API_KEY=${{ secrets.API_KEY }}
          CLUB1_NAME=${{ secrets.CLUB1_NAME }}
          CLUB2_NAME=${{ secrets.CLUB2_NAME }}
          SIGNED_URL_EXPIRY_DAYS=7
          MAX_RECORDING_HOURS=5
          MAX_CONCURRENT_RECORDINGS=3
          RECORDER_MODE=1
          TEMP_DIR=./temp
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATUS_INTERVAL_MINUTES=5
          TELEGRAM_REMINDER_MINUTES_BEFORE=10
          TG_UPLOAD_TOKEN=${{ secrets.TG_UPLOAD_TOKEN }}
          TG_UPLOAD_CHAT_ID=${{ secrets.TG_UPLOAD_CHAT_ID }}
          GH_PAT=${{ secrets.GH_PAT }}
          IA_ACCESS_KEY=${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY=${{ secrets.IA_SECRET_KEY }}
          SEAL_SECRET=${{ secrets.SEAL_SECRET }}
          HOP_KEY=${{ secrets.HOP_KEY }}
          EGRESS_HOPS=${{ secrets.EGRESS_HOPS }}
          EOF

      - name: Start local Telegram Bot API (رفع أجزاء حتى 2GB لتيليجرام)
        # اختياري: لو ما ضبطت TG_API_ID و TG_API_HASH بالـ Secrets يتخطى، والرفع يصير عبر الخادم الرسمي (حد 50MB للجزء)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "تخطي: TG_API_ID / TG_API_HASH غير مضبوطين — الرفع لتيليجرام بالحد الرسمي 50MB"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/tgapi"
          docker run -d --name tgapi -p 127.0.0.1:8081:8081 \
            -v "$RUNNER_TEMP/tgapi:/var/lib/telegram-bot-api" \
            -e TELEGRAM_API_ID="$TG_API_ID" -e TELEGRAM_API_HASH="$TG_API_HASH" -e TELEGRAM_LOCAL=1 \
            aiogram/telegram-bot-api:latest
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
          echo "TG_UPLOAD_API=http://127.0.0.1:8081" >> .env
          echo "TG_UPLOAD_LOCAL=1" >> .env
          echo "✅ telegram-bot-api المحلي شغال"

      - name: Start server
        run: |
          nohup npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: sleep 5

      - name: Download cloudflared
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start Cloudflare quick tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:3000 > cf.log 2>&1 &
          echo $! > cf.pid

      - name: Wait for tunnel URL
        run: |
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cf.log | head -n1)
            if [ -n "$URL" ]; then
              echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
              echo "$URL" > tunnel_url.txt
              echo "Found: $URL"
              break
            fi
            sleep 2
          done

      - name: Wait until tunnel answers
        run: |
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -m 6 -w '%{http_code}' "${{ env.TUNNEL_URL }}/" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || [ "$CODE" = "404" ]; then echo "tunnel ok ($CODE)"; break; fi
            sleep 3
          done

      - name: Publish recorder URL to GitHub Pages
        run: |
          mkdir -p docs
          cat > docs/recorder-stream.json << EOF
          {
            "panelUrl": "${{ env.TUNNEL_URL }}",
            "startedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/recorder-stream.json
          git commit -m "تحديث رابط أكشن التسجيل [skip ci]" || echo "لا فيه تغيير للحفظ"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break
            sleep 3
          done

      - name: Notify Telegram
        run: |
          MSG=$'🎥 أكشن التسجيل جاهز ويشتغل.\n\nروح لقسم "تسجيل" بالموقع وحط الرابط:\nhttps://ahmedtwi99-boop.github.io/Zone-BarMi/\n\n(هذا الأكشن مستقل ما يتجدد ولا ينتقل، يبقى شغّال لين تخلص أو توقفه.)'
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$MSG"

      - name: Keep session alive
        run: |
          while true; do
            if ! kill -0 $(cat server.pid) 2>/dev/null; then
              echo "Server process died - exiting keep-alive loop."
              break
            fi
            sleep 60
          done
