name: Live Stream Relay (Auto)

# الوضع التلقائي: يجدد نفسه ويحوّل المشاهدين للنسخة الجديدة بدون انقطاع.
# اليدوي (Live Stream Relay) ما تغيّر — هذا ملف منفصل. لا تشغّل الاثنين مع بعض.
# إيقاف التجديد: Settings → Secrets and variables → Actions → Variables → ZONE_AUTO = off

on:
  workflow_dispatch:
    inputs:
      chain:
        description: 'رقم التجديد (لا تغيّره — يملأه الأكشن بنفسه)'
        default: '0'
      max_chain:
        description: 'أقصى عدد تجديدات'
        default: '4'
      renew_after_min:
        description: 'بعد كم دقيقة يجدد (الافتراضي 300 = 5 ساعات). للتجربة السريعة حط 12'
        default: '300'

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Create .env
        env:
          RENEW_MIN: ${{ inputs.renew_after_min }}
        run: |
          date +%s > start_ts
          case "$RENEW_MIN" in ''|*[!0-9]*) RENEW_MIN=300 ;; esac
          if [ "$RENEW_MIN" -lt 5 ]; then RENEW_MIN=5; fi
          RENEW_MS=$(( RENEW_MIN * 60 * 1000 ))
          cat > .env << EOF
          PORT=3000
          API_KEY=${{ secrets.API_KEY }}
          CLUB1_NAME=${{ secrets.CLUB1_NAME }}
          CLUB2_NAME=${{ secrets.CLUB2_NAME }}
          SIGNED_URL_EXPIRY_DAYS=7
          MAX_RECORDING_HOURS=5
          MAX_CONCURRENT_RECORDINGS=2
          TEMP_DIR=./temp
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATUS_INTERVAL_MINUTES=5
          TELEGRAM_REMINDER_MINUTES_BEFORE=10
          TG_UPLOAD_TOKEN=${{ secrets.TG_UPLOAD_TOKEN }}
          TG_UPLOAD_CHAT_ID=${{ secrets.TG_UPLOAD_CHAT_ID }}
          GH_PAT=${{ secrets.GH_PAT }}
          IA_ACCESS_KEY=${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY=${{ secrets.IA_SECRET_KEY }}
          SEAL_SECRET=${{ secrets.SEAL_SECRET }}
          HOP_KEY=${{ secrets.HOP_KEY }}
          EGRESS_HOPS=${{ secrets.EGRESS_HOPS }}
          AUTO_MODE=true
          AUTO_CHAIN=${{ inputs.chain }}
          AUTO_MAX_CHAIN=${{ inputs.max_chain }}
          AUTO_RENEW_MIN=$RENEW_MIN
          AUTO_RENEW_AT_MS=$RENEW_MS
          AUTO_REPO=${{ github.repository }}
          AUTO_REF=${{ github.ref_name }}
          EOF

      - name: Start local Telegram Bot API (رفع أجزاء حتى 2GB لتيليجرام)
        # اختياري: لو ما ضبطت TG_API_ID و TG_API_HASH بالـ Secrets يتخطى، والرفع يصير عبر الخادم الرسمي (حد 50MB للجزء)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "تخطي: TG_API_ID / TG_API_HASH غير مضبوطين — الرفع لتيليجرام بالحد الرسمي 50MB"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/tgapi"
          docker run -d --name tgapi -p 127.0.0.1:8081:8081 \
            -v "$RUNNER_TEMP/tgapi:/var/lib/telegram-bot-api" \
            -e TELEGRAM_API_ID="$TG_API_ID" -e TELEGRAM_API_HASH="$TG_API_HASH" -e TELEGRAM_LOCAL=1 \
            aiogram/telegram-bot-api:latest
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
          echo "TG_UPLOAD_API=http://127.0.0.1:8081" >> .env
          echo "TG_UPLOAD_LOCAL=1" >> .env
          echo "✅ telegram-bot-api المحلي شغال"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Start server (auto mode)
        run: |
          nohup node -r ./auto/preload.js server.js > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: sleep 5

      - name: Download cloudflared
        run: |
          curl -sSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared

      - name: Start Cloudflare quick tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:3000 > cf.log 2>&1 &
          echo $! > cf.pid

      - name: Wait for tunnel URL
        run: |
          for i in $(seq 1 30); do
            URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' cf.log | head -n1)
            if [ -n "$URL" ]; then
              echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
              echo "Found: $URL"
              break
            fi
            sleep 2
          done

      - name: Handoff (نقل الحالة والنشر والتبديل)
        continue-on-error: true
        run: node auto/handoff.js

      - name: Keep session alive + renew
        run: node auto/keepalive.js
